name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            set -e
            cd /home/lyaris/BeatYourself
            git fetch --all
            git reset --hard origin/main
            cd beatyourself
            npm ci
            npx prisma generate
            npm run build
            pm2 restart beatyourself --update-env
            echo "Deploy complete"
